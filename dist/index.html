<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeaverReader</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #f6f3ee;
        --accent: #2d6a4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8e4dc;
          --bg: #121210;
          --accent: #52b788;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        line-height: 1.5;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.85;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BeaverReader</h1>
      <p>
        Mobile reading app for iOS and Android. Install from the store when
        available.
      </p>
      <p class="hint">This site is a lightweight placeholder for Cloudflare hosting.</p>
    </main>
  </body>
</html>
