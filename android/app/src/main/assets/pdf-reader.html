<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PDF Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }
        html {
            background: #fafafa;
            overscroll-behavior: none;
            overflow: hidden;
        }
        #pdf-container {
            width: 100%;
            height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f5f5f5;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        #pdf-container.hidden {
            display: none !important;
        }
        #canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #text-container {
            display: none;
            width: 100%;
            height: calc(100vh - 100px);
            max-height: calc(100vh - 100px);
            overflow-y: hidden;
            overflow-x: hidden;
            -webkit-overflow-scrolling: auto;
            overscroll-behavior: none;
            background: #fafafa;
            padding: 20px;
            padding-top: calc(env(safe-area-inset-top, 20px) + 40px);
            padding-bottom: 100px;
            box-sizing: border-box;
            touch-action: pan-y;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }
        #text-container.visible {
            display: block !important;
        }
        .text-page {
            max-width: 600px;
            margin: 0 auto;
            font-size: 20px;
            line-height: 1.75;
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            white-space: pre-wrap;
            word-wrap: break-word;
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }
        .text-page.fading {
            opacity: 0;
        }
        .text-page p {
            margin-bottom: 1.5em;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading PDF...</div>
    <div id="pdf-container" class="hidden">
        <canvas id="canvas"></canvas>
    </div>
    <div id="text-container" class="hidden">
        <div class="text-page" id="text-content"></div>
    </div>

    <script>
        // Configure pdf.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Global state
        let pdfDoc = null;
        let currentPage = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let readerMode = 'pdf'; // 'pdf' or 'text'
        let textPages = [];
        let currentTextPage = 0;
        let extractedText = null;
        let allHighlights = []; // Store all highlights in memory
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pdfContainer = document.getElementById('pdf-container');
        const textContainer = document.getElementById('text-container');
        const textContent = document.getElementById('text-content');
        const loading = document.getElementById('loading');

        // Send message to React Native
        function sendMessage(data) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(data));
            }
        }

        // ========== TEXT EXTRACTION & PAGINATION ==========
        
        // Extract text from all PDF pages
        async function extractAllText() {
            console.log('🔍 extractAllText called!');
            
            // Skip all caches - always extract fresh
            // This ensures the latest extraction algorithm is used
            
            if (extractedText && extractedText.length > 0) {
                console.log('✅ Using in-memory extracted text (', extractedText.length, 'chars)');
                return extractedText;
            }
            
            const extractStartTime = Date.now();
            console.log('📖 Extracting text from PDF...', pdfDoc.numPages, 'pages');
            
            const pageTexts = [];
            
            try {
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    
                    // Simple approach: use pdf.js items in order, just handle spacing
                    // pdf.js returns items in content stream order which is usually correct
                    let pageText = '';
                    let lastY = null;
                    let lastEndX = null;
                    const lineHeight = 12; // approximate line height for paragraph detection
                    
                    for (let j = 0; j < content.items.length; j++) {
                        const item = content.items[j];
                        const str = item.str;
                        
                        // Skip completely empty items
                        if (str === '') continue;
                        
                        const y = item.transform[5];
                        const x = item.transform[4];
                        
                        if (lastY !== null) {
                            const yDiff = Math.abs(lastY - y);
                            
                            if (yDiff > lineHeight * 1.8) {
                                // Large vertical gap = new paragraph
                                pageText += '\n\n';
                            } else if (yDiff > 2) {
                                // Small vertical change = new line
                                // Join hyphenated words at line breaks
                                if (pageText.endsWith('-')) {
                                    pageText = pageText.slice(0, -1); // remove hyphen
                                } else {
                                    pageText += ' ';
                                }
                            } else {
                                // Same line - check horizontal spacing
                                if (lastEndX !== null && x > lastEndX + 2) {
                                    pageText += ' ';
                                }
                            }
                        }
                        
                        pageText += str;
                        lastY = y;
                        lastEndX = x + (item.width || 0);
                    }
                    
                    const trimmed = pageText.trim();
                    if (trimmed.length > 0) {
                        pageTexts.push(trimmed);
                    }
                    
                    console.log(`✅ Page ${i}/${pdfDoc.numPages}: ${trimmed.length} chars`);
                }
                
                // Join pages with double newlines
                const fullText = pageTexts.join('\n\n');
                const extractTime = Date.now() - extractStartTime;
                console.log('✅ Text extracted:', fullText.length, 'characters in', extractTime, 'ms');
                extractedText = fullText;
                
                // Send extracted text back to React Native for caching
                sendMessage({
                    type: 'textExtracted',
                    text: fullText
                });
                
                return fullText;
                
            } catch (error) {
                console.error('❌ Error extracting text:', error);
                sendMessage({
                    type: 'error',
                    message: 'Failed to extract text: ' + error.message
                });
                return '';
            } finally {
                loading.classList.add('hidden');
            }
        }
        
        // Paginate text into smart chunks that fit on screen
        function paginateText(fullText, targetWords = 200) {
            console.log('📄 Paginating text...');
            
            // Split into paragraphs
            const paragraphs = fullText.split(/\n\n+/).filter(p => p.trim().length > 0);
            const pages = [];
            let currentPage = [];
            let wordCount = 0;
            
            paragraphs.forEach((para, index) => {
                const trimmedPara = para.trim();
                const paraWords = trimmedPara.split(/\s+/).length;
                
                // If this paragraph alone exceeds 300 words, split it into sentences
                if (paraWords > 300) {
                    // Flush current page if it has content
                    if (currentPage.length > 0) {
                        pages.push(currentPage.join('\n\n'));
                        currentPage = [];
                        wordCount = 0;
                    }
                    
                    // Split long paragraph by sentences
                    const sentences = trimmedPara.match(/[^.!?]+[.!?]+/g) || [trimmedPara];
                    let sentenceBuffer = [];
                    let sentenceWordCount = 0;
                    
                    sentences.forEach(sentence => {
                        const sentenceWords = sentence.trim().split(/\s+/).length;
                        
                        if (sentenceWordCount + sentenceWords > 250 && sentenceBuffer.length > 0) {
                            pages.push(sentenceBuffer.join(' '));
                            sentenceBuffer = [sentence.trim()];
                            sentenceWordCount = sentenceWords;
                        } else {
                            sentenceBuffer.push(sentence.trim());
                            sentenceWordCount += sentenceWords;
                        }
                    });
                    
                    if (sentenceBuffer.length > 0) {
                        pages.push(sentenceBuffer.join(' '));
                    }
                    return;
                }
                
                // If adding this paragraph exceeds 250 words, start new page
                if (wordCount + paraWords > 250 && currentPage.length > 0) {
                    pages.push(currentPage.join('\n\n'));
                    currentPage = [trimmedPara];
                    wordCount = paraWords;
                } else {
                    currentPage.push(trimmedPara);
                    wordCount += paraWords;
                }
            });
            
            // Add remaining content
            if (currentPage.length > 0) {
                pages.push(currentPage.join('\n\n'));
            }
            
            console.log('✅ Created', pages.length, 'text pages');
            return pages;
        }
        
        // Render text page
        function renderTextPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= textPages.length) {
                console.warn('Invalid text page index:', pageIndex);
                return;
            }
            
            // Fade out
            textContent.classList.add('fading');
            
            setTimeout(() => {
                currentTextPage = pageIndex;
                textContent.innerHTML = ''; // Clear previous content
                
                // Get the text for this page
                const pageText = textPages[pageIndex];
                
                // Apply highlights to this page's text
                let htmlContent = pageText;
                const pageHighlights = allHighlights.filter(h => {
                    // Check if this highlight's text is in the current page
                    const normalizedPageText = pageText.replace(/\s+/g, ' ').trim();
                    const normalizedHighlightText = h.text.replace(/\s+/g, ' ').trim();
                    return normalizedPageText.includes(normalizedHighlightText);
                });
                
                console.log('📄 Rendering page', pageIndex + 1, 'with', pageHighlights.length, 'highlights');
                
                // Apply each highlight to the HTML
                pageHighlights.forEach(highlight => {
                    const escapedText = highlight.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escapedText, 'g');
                    htmlContent = htmlContent.replace(regex, (match) => {
                        return `<span class="highlight-marker" style="background-color: ${highlight.color}; cursor: pointer; transition: background-color 0.3s ease;" data-color="${highlight.color}" data-id="${highlight.id}" onclick="window.handleHighlightClick('${highlight.id}')">${match}</span>`;
                    });
                });
                
                textContent.innerHTML = htmlContent;
                
                // Scroll to top
                textContainer.scrollTop = 0;
                
                // Fade in
                textContent.classList.remove('fading');
                
                // Send update to React Native
                const progress = textPages.length > 1 ? currentTextPage / (textPages.length - 1) : 0;
                sendMessage({
                    type: 'locationChanged',
                    page: currentTextPage + 1,
                    totalPages: textPages.length,
                    progress: progress,
                    mode: 'text'
                });
                
                console.log('📖 Showing text page', currentTextPage + 1, '/', textPages.length);
            }, 200); // Wait for fade out animation
        }
        
        // Switch between PDF and Text modes
        async function switchMode(mode) {
            console.log('🔄 Switching to mode:', mode);
            console.log('🔄 textPages.length:', textPages.length);
            console.log('🔄 window.cachedExtractedText available?', !!window.cachedExtractedText);
            readerMode = mode;
            
            if (mode === 'text') {
                // Extract and paginate text if not done yet
                if (textPages.length === 0) {
                    console.log('📖 textPages is empty, will call extractAllText...');
                    const fullText = await extractAllText();
                    
                    if (!fullText || fullText.length < 100) {
                        sendMessage({
                            type: 'error',
                            message: 'Could not extract readable text from this PDF'
                        });
                        // Switch back to PDF mode
                        readerMode = 'pdf';
                        return;
                    }
                    
                    textPages = paginateText(fullText);
                }
                
                // Hide PDF, show text
                console.log('👁️ Hiding PDF container, showing text container');
                pdfContainer.classList.add('hidden');
                textContainer.classList.add('visible');
                
                // Try to map current PDF page to text page (rough approximation)
                const estimatedTextPage = Math.floor((currentPage / pdfDoc.numPages) * textPages.length);
                renderTextPage(Math.min(estimatedTextPage, textPages.length - 1));
                
            } else {
                // Hide text, show PDF
                console.log('👁️ Hiding text container, showing PDF container');
                textContainer.classList.remove('visible');
                pdfContainer.classList.remove('hidden');
                
                // Try to map current text page to PDF page
                if (textPages.length > 0 && pdfDoc) {
                    const estimatedPdfPage = Math.ceil((currentTextPage / textPages.length) * pdfDoc.numPages);
                    currentPage = Math.max(1, Math.min(estimatedPdfPage, pdfDoc.numPages));
                }
                
                queueRenderPage(currentPage);
            }
            
            sendMessage({
                type: 'modeChanged',
                mode: mode
            });
        }

        // ========== PDF RENDERING ==========

        // Render a page
        function renderPage(num) {
            pageRendering = true;
            
            pdfDoc.getPage(num).then(function(page) {
                // Calculate scale to fit screen width with device pixel ratio for crisp rendering
                const viewport = page.getViewport({ scale: 1.0 });
                const containerWidth = window.innerWidth - 40;
                const baseScale = containerWidth / viewport.width;
                
                // Add zoom multiplier to make text more readable (1.5x larger)
                const zoomMultiplier = 1.5;
                const scale = baseScale * zoomMultiplier;
                
                // Use device pixel ratio for high-quality rendering
                const devicePixelRatio = window.devicePixelRatio || 1;
                const scaledViewport = page.getViewport({ scale: scale * devicePixelRatio });

                // Set canvas size for high-DPI displays
                canvas.height = scaledViewport.height;
                canvas.width = scaledViewport.width;
                
                // Scale down the canvas display size
                canvas.style.width = (scaledViewport.width / devicePixelRatio) + 'px';
                canvas.style.height = (scaledViewport.height / devicePixelRatio) + 'px';

                const renderContext = {
                    canvasContext: ctx,
                    viewport: scaledViewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }

                    // Send location update
                    const progress = (currentPage - 1) / (pdfDoc.numPages - 1);
                    sendMessage({
                        type: 'locationChanged',
                        page: currentPage,
                        totalPages: pdfDoc.numPages,
                        progress: progress
                    });
                });
            }).catch(function(error) {
                console.error('Error rendering page:', error);
                sendMessage({
                    type: 'error',
                    message: 'Error rendering page: ' + error.message
                });
            });
        }

        // Queue page rendering
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        // Go to previous page
        function prevPage() {
            if (readerMode === 'text') {
                if (currentTextPage > 0) {
                    renderTextPage(currentTextPage - 1);
                }
            } else {
                if (currentPage <= 1) {
                    return;
                }
                currentPage--;
                queueRenderPage(currentPage);
            }
        }

        // Go to next page
        function nextPage() {
            if (readerMode === 'text') {
                if (currentTextPage < textPages.length - 1) {
                    renderTextPage(currentTextPage + 1);
                }
            } else {
                if (currentPage >= pdfDoc.numPages) {
                    return;
                }
                currentPage++;
                queueRenderPage(currentPage);
            }
        }

        // Go to specific page
        function goToPage(pageNum) {
            if (readerMode === 'text') {
                const textPageIndex = pageNum - 1;
                if (textPageIndex >= 0 && textPageIndex < textPages.length) {
                    renderTextPage(textPageIndex);
                }
            } else {
                if (pageNum < 1 || pageNum > pdfDoc.numPages) {
                    return;
                }
                currentPage = pageNum;
                queueRenderPage(currentPage);
            }
        }

        // Initialize PDF from base64 data
        function initReaderWithData() {
            if (!window.pdfBase64Data) {
                console.error('No PDF data available');
                sendMessage({
                    type: 'error',
                    message: 'No PDF data received'
                });
                return;
            }
            
            const base64Data = window.pdfBase64Data;
            console.log('Loading PDF from base64 data, size:', base64Data.length);
            
            try {
                const conversionStartTime = Date.now();
                // Convert base64 to Uint8Array
                var binaryString = atob(base64Data);
                var len = binaryString.length;
                var bytes = new Uint8Array(len);
                for (var i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const conversionTime = Date.now() - conversionStartTime;
                console.log('✅ Converted to Uint8Array in', conversionTime, 'ms, size:', bytes.length);
                
                // Load PDF from byte array
                const parseStartTime = Date.now();
                console.log('📄 Parsing PDF with pdf.js...');
                pdfjsLib.getDocument({data: bytes}).promise
                    .then(function(pdf) {
                        const parseTime = Date.now() - parseStartTime;
                        pdfDoc = pdf;
                        console.log('✅ PDF parsed in', parseTime, 'ms. Pages:', pdf.numPages);

                        loading.classList.add('hidden');
                        pdfContainer.classList.remove('hidden');

                        sendMessage({
                            type: 'ready',
                            totalPages: pdf.numPages
                        });

                        renderPage(currentPage);
                    })
                    .catch(function(error) {
                        console.error('Error loading PDF:', error);
                        sendMessage({
                            type: 'error',
                            message: 'Error loading PDF: ' + error.message
                        });
                    });
            } catch (error) {
                console.error('Error converting base64:', error);
                sendMessage({
                    type: 'error',
                    message: 'Error converting PDF data: ' + error.message
                });
            }
        }
        
        // Make functions globally accessible for injectJavaScript
        window.prevPage = prevPage;
        window.nextPage = nextPage;
        window.goToPage = goToPage;
        window.switchMode = switchMode;
        
        // Make it globally accessible
        window.initReaderWithData = initReaderWithData;

        // Add swipe and tap detection for text container
        let touchStartY = 0;
        let touchStartX = 0;
        let touchStartTime = 0;
        let isNavigating = false;
        
        textContainer.addEventListener('touchstart', function(e) {
            if (readerMode !== 'text') return;
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            touchStartTime = Date.now();
            isNavigating = false;
        }, { passive: true });
        
        textContainer.addEventListener('touchmove', function(e) {
            if (readerMode !== 'text') return;
            
            const touchCurrentY = e.touches[0].clientY;
            const deltaY = Math.abs(touchStartY - touchCurrentY);
            
            // Mark as navigating if significant movement
            if (deltaY > 20) {
                isNavigating = true;
            }
        }, { passive: true });
        
        textContainer.addEventListener('touchend', function(e) {
            if (readerMode !== 'text') return;
            
            const touchEndY = e.changedTouches[0].clientY;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndTime = Date.now();
            
            const deltaY = touchStartY - touchEndY;
            const deltaX = Math.abs(touchStartX - touchEndX);
            const deltaTime = touchEndTime - touchStartTime;
            
            // Check if it's a tap (minimal movement, quick)
            if (Math.abs(deltaY) < 10 && deltaX < 10 && deltaTime < 300 && !isNavigating) {
                console.log('📱 Text container tapped');
                sendMessage({
                    type: 'toggleButtons'
                });
                return;
            }
            
            // Check if it's a vertical swipe (not horizontal)
            if (deltaX > 50 || deltaTime > 400) {
                isNavigating = false;
                return; // Too much horizontal movement or too slow
            }
            
            // Swipe up (deltaY > 0) = next page
            if (deltaY > 50 && isNavigating) {
                console.log('⬆️ Swipe up - next text page');
                nextPage();
            }
            // Swipe down (deltaY < 0) = previous page
            else if (deltaY < -50 && isNavigating) {
                console.log('⬇️ Swipe down - previous text page');
                prevPage();
            }
            
            isNavigating = false;
        }, { passive: false });

        // Listen for messages from React Native (for navigation commands only)
        window.addEventListener('message', function(event) {
            try {
                console.log('📬 WebView received message:', event.data);
                const data = JSON.parse(event.data);
                console.log('📬 Parsed command:', data.command);

                switch (data.command) {
                    case 'next':
                        console.log('▶️ Executing next page');
                        nextPage();
                        break;
                    case 'prev':
                        console.log('◀️ Executing previous page');
                        prevPage();
                        break;
                    case 'goToPage':
                        console.log('🔢 Going to page:', data.page);
                        goToPage(data.page);
                        break;
                    default:
                        console.log('❓ Unknown command:', data.command);
                }
            } catch (e) {
                console.error('❌ Error processing message:', e, 'Raw data:', event.data);
            }
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (pdfDoc && currentPage) {
                queueRenderPage(currentPage);
            }
        });

        // Handle text selection - store selection but don't show sheet yet
        let pendingSelection = null;
        let pendingPage = null;
        let storedRange = null; // Store the actual Range object
        
        document.addEventListener('selectionchange', function() {
            const selection = window.getSelection();
            if (selection && selection.toString().trim().length > 0 && selection.rangeCount > 0) {
                const selectedText = selection.toString().trim();
                console.log('📝 Text selected:', selectedText);
                // Store selection and range but don't send yet
                pendingSelection = selectedText;
                pendingPage = currentPage || pageNum || 1;
                // Store a copy of the range for later use
                try {
                    storedRange = selection.getRangeAt(0).cloneRange();
                    console.log('✅ Range stored for highlighting');
                } catch (e) {
                    console.error('❌ Failed to store range:', e);
                }
            }
        });
        
        // Handle highlight click (for dynamically created highlights)
        window.handleHighlightClick = function(highlightId) {
            console.log('🖱️🖱️🖱️ HIGHLIGHT CLICKED! 🖱️🖱️🖱️');
            console.log('WebView ID received:', highlightId);
            console.log('Total highlights in memory:', allHighlights.length);
            console.log('All highlight IDs:', allHighlights.map(h => h.id).join(', '));
            
            const highlight = allHighlights.find(h => h.id === highlightId);
            
            if (highlight) {
                console.log('✅ Found highlight in memory!');
                console.log('  - Text:', highlight.text.substring(0, 50) + '...');
                console.log('  - Color:', highlight.color);
                console.log('  - WebView ID:', highlight.id);
                console.log('  - Database ID:', highlight.dbId);
                
                sendMessage({
                    type: 'highlightClicked',
                    text: highlight.text,
                    color: highlight.color,
                    id: highlight.id,
                    dbId: highlight.dbId, // Include database ID
                });
                console.log('📤 Message sent to React Native');
            } else {
                console.error('❌❌❌ HIGHLIGHT NOT FOUND IN MEMORY! ❌❌❌');
                console.error('Searched for ID:', highlightId);
                console.error('Available highlights:', JSON.stringify(allHighlights.map(h => ({
                    id: h.id,
                    dbId: h.dbId,
                    text: h.text.substring(0, 30)
                }))));
            }
        };
        
        // Apply visual highlight to stored range
        window.applyHighlight = function(text, color, dbId) {
            console.log('🎨 applyHighlight called with text:', text, 'color:', color, 'dbId:', dbId);
            
            if (!text) {
                console.log('❌ No text provided to highlight');
                return;
            }
            
            // Create highlight object
            const highlightId = 'h-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            const highlightObj = {
                id: highlightId,
                dbId: dbId, // Store database ID
                text: text,
                color: color,
                page: currentTextPage
            };
            
            // Add to memory
            allHighlights.push(highlightObj);
            console.log('✅ Highlight added to memory:', highlightId, 'dbId:', dbId, 'Total highlights:', allHighlights.length);
            
            // Re-render the current page to show the highlight
            renderTextPage(currentTextPage);
        };
        
        // Send selection only when user lifts finger
        document.addEventListener('touchend', function() {
            if (pendingSelection) {
                console.log('👆 Finger lifted, showing action sheet');
                sendMessage({
                    type: 'textSelected',
                    text: pendingSelection,
                    page: pendingPage,
                });
                pendingSelection = null;
                pendingPage = null;
                // Keep storedRange for highlighting
            }
        });
        
        // Also handle mouse up for desktop testing
        document.addEventListener('mouseup', function() {
            if (pendingSelection) {
                console.log('🖱️ Mouse released, showing action sheet');
                sendMessage({
                    type: 'textSelected',
                    text: pendingSelection,
                    page: pendingPage,
                });
                pendingSelection = null;
                pendingPage = null;
                // Keep storedRange for highlighting
            }
        });

        // Restore highlights from database
        window.restoreHighlights = function(highlights) {
            console.log('🔄 Restoring', highlights.length, 'highlights from database');
            
            // Add all highlights to memory
            highlights.forEach((highlight, index) => {
                const highlightId = 'h-' + Date.now() + '-' + index + '-' + Math.random().toString(36).substr(2, 9);
                allHighlights.push({
                    id: highlightId,
                    dbId: highlight.dbId, // Store database ID
                    text: highlight.text,
                    color: highlight.color,
                    page: highlight.page || 0
                });
                console.log(`✅ Added highlight ${index + 1} to memory:`, highlight.text.substring(0, 50), 'dbId:', highlight.dbId);
            });
            
            console.log('✅ All', allHighlights.length, 'highlights loaded into memory');
            
            // Re-render current page to show highlights
            if (readerMode === 'text' && textPages.length > 0) {
                renderTextPage(currentTextPage);
            }
        };
        
        // Update highlight color in memory
        window.updateHighlightColor = function(highlightId, newColor) {
            console.log('🎨 Updating highlight color in memory:', highlightId, 'to', newColor);
            const highlight = allHighlights.find(h => h.id === highlightId);
            if (highlight) {
                highlight.color = newColor;
                console.log('✅ Color updated in memory');
                // Re-render current page to show change
                if (readerMode === 'text') {
                    renderTextPage(currentTextPage);
                }
                return true;
            }
            console.log('❌ Highlight not found in memory');
            return false;
        };
        
        // Delete highlight from memory
        window.deleteHighlight = function(highlightId) {
            console.log('🗑️🗑️🗑️ WebView: DELETE HIGHLIGHT CALLED 🗑️🗑️🗑️');
            console.log('WebView: Deleting highlight from memory, ID:', highlightId);
            console.log('WebView: Total highlights before delete:', allHighlights.length);
            console.log('WebView: All highlight IDs:', allHighlights.map(h => h.id).join(', '));
            
            const index = allHighlights.findIndex(h => h.id === highlightId);
            console.log('WebView: Found at index:', index);
            
            if (index !== -1) {
                const deletedHighlight = allHighlights[index];
                console.log('WebView: Deleting highlight:', deletedHighlight.text.substring(0, 50));
                allHighlights.splice(index, 1);
                console.log('WebView: ✅ Highlight deleted from memory. Remaining:', allHighlights.length);
                
                // Re-render current page to remove highlight
                if (readerMode === 'text') {
                    console.log('WebView: Re-rendering page to remove highlight...');
                    renderTextPage(currentTextPage);
                    console.log('WebView: ✅ Page re-rendered');
                }
                return true;
            }
            console.error('WebView: ❌❌❌ Highlight NOT FOUND in memory! ❌❌❌');
            console.error('WebView: Searched for ID:', highlightId);
            return false;
        };

        // Signal ready
        sendMessage({ type: 'webviewReady' });
    </script>
</body>
</html>
