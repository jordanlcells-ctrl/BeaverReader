<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>EPUB Reader</title>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* RN injects real insets here — Android WebView often leaves env(safe-area-*) at 0 while drawing edge-to-edge. */
    html {
      --rn-safe-top: 0px;
      --rn-safe-right: 0px;
      --rn-safe-bottom: 0px;
      --rn-safe-left: 0px;
      /*
       * WebKit: keeps glyph ink inside line boxes so overflow:hidden on #page-window
       * does not slice descenders / italic stems (Apple Books; see Foliate #177).
       * Harmless no-op on engines that ignore it.
       */
      -webkit-line-box-contain: block glyphs replaced;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg, #fff); }
    body {
      -webkit-line-box-contain: block glyphs replaced;
    }
    /*
     * Use flex (not height:100% on #page-window): Android WebView often resolves % height
     * against the viewport and ignores #reader padding, so text drew flush to the top.
     */
    #reader {
      position: fixed;
      /* inset:0 is unsupported on API 24 WebView — breaks the whole reader frame */
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 16px 48px;
      /* No CSS max() — not supported on Android 7 / API 24 WebView. RN setReaderChrome overrides with !important. */
      padding-top: calc(52px + 28px + env(safe-area-inset-top, 0px) + var(--rn-safe-top, 0px));
      padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--rn-safe-bottom, 0px));
      overflow: hidden;
      touch-action: pan-x pinch-zoom;
      -webkit-user-select: text; user-select: text;
    }
    #page-window {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
    }
    #epub-content {
      position: absolute; top: 0; left: 0;
      will-change: transform; transition: opacity 0.15s ease-out;
    }
    #status {
      position: fixed; bottom: calc(6px + env(safe-area-inset-bottom, 0px) + var(--rn-safe-bottom, 0px)); left: 0; right: 0;
      text-align: center; font-family: -apple-system, sans-serif;
      font-size: 12px; color: #bbb; pointer-events: none;
    }
    .epub-hl {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: rgba(0,0,0,0.15);
      pointer-events: auto !important;
      cursor: pointer !important;
    }
  </style>
</head>
<body>
<div id="reader">
  <div id="page-window">
    <div id="epub-content"></div>
  </div>
</div>
<div id="status">Loading…</div>
<script>
(function () {
  var book = null;
  var spineItems = [];
  var currentSectionIndex = 0;
  var currentPage = 0;
  var totalPages = 1;
  var highlightMap = {};
  var sectionLoading = false;
  var sectionLoadId = 0;
  var fontSize = 18;
  var lineHeight = 1.65;
  var PW = 0, PH = 0;
  var sectionRestorePage = null;
  var pendingRestorePage = null;
  var waitingForImageRestore = false;
  var darkMode = false;
  var showContentTimer = null;
  /** When true (after TOC goToSection): one column, vertical scroll — avoids broken multi-column + translateX in WebView. */
  window.__epubReflowMode = false;
  /** Natural #page-window clientHeight snapshot (fallback before inner band is measurable). */
  window.__epubReflowNaturalVh = 0;
  /**
   * Physical inset inside #page-window (reflow only). Absolute #epub-content is positioned below
   * the padding edge — unlike content padding, translateY cannot scroll text into this band,
   * so it reliably clears overflow:hidden clipping (tablet landscape / WebKit).
   */
  var EPUB_RF_WIN_PAD_TOP = 28;
  var EPUB_RF_WIN_PAD_BOT = 42;

  function epubReflowLand() {
    try {
      return window.innerWidth > window.innerHeight + 1;
    } catch (eL) {
      return false;
    }
  }
  function epubReflowWinPadTop() {
    if (!window.__epubReflowMode) return 0;
    return EPUB_RF_WIN_PAD_TOP + (epubReflowLand() ? 22 : 18);
  }
  function epubReflowWinPadBot() {
    if (!window.__epubReflowMode) return 0;
    /* Landscape viewports are short — need at least as much bottom band as portrait or last line bisects the clip. */
    return EPUB_RF_WIN_PAD_BOT + (epubReflowLand() ? 32 : 20);
  }

  /** Extra px above #page-window inner bottom — line boxes + caret probes need this or the last line bisects the clip. */
  function reflowFoldBottomSlackPx() {
    try {
      var lh = Math.max(14, Math.round(fontSize * lineHeight));
      if (epubReflowLand()) {
        return Math.max(50, Math.round(lh * 0.62));
      }
      return Math.max(44, Math.round(lh * 0.58));
    } catch (eSl) {
      return 44;
    }
  }

  /** True inner text band inside #page-window (clientHeight minus *computed* padding — fixes JS/CSS drift). */
  function reflowPageWinInnerBandPx(pw) {
    if (!pw) return null;
    try {
      var cs = getComputedStyle(pw);
      var pt = parseFloat(cs.paddingTop) || 0;
      var pb = parseFloat(cs.paddingBottom) || 0;
      var h = pw.clientHeight - pt - pb;
      return isFinite(h) ? h : null;
    } catch (eBand) {
      return null;
    }
  }

  function reflowPageWinPadTopPx(pw) {
    if (!pw) return epubReflowWinPadTop();
    try {
      var v = parseFloat(getComputedStyle(pw).paddingTop);
      if (isFinite(v) && v >= 0) return v;
    } catch (ePt) {}
    return epubReflowWinPadTop();
  }

  function reflowPageWinPadBottomPx(pw) {
    if (!pw) return epubReflowWinPadBot();
    try {
      var v = parseFloat(getComputedStyle(pw).paddingBottom);
      if (isFinite(v) && v >= 0) return v;
    } catch (ePb) {}
    return epubReflowWinPadBot();
  }

  var epubReflowResizeTimer = null;
  function handleEpubViewportRelayout() {
    if (!window.__epubReflowMode) {
      measurePage();
      paginate(function () { showPage(currentPage); });
      return;
    }
    applyOverrideSheet();
    remeasureReflowAfterLayoutChromeChange();
  }

  /* Highlight click support */
  window._epubHighlightById = {};
  window.handleEpubHighlightClick = function (id) {
    var p = window._epubHighlightById && window._epubHighlightById[id];
    if (p) {
      send({
        type: 'highlightClicked',
        text: p.text || '', cfi: p.cfi || '',
        color: p.color || '', dbId: p.dbId != null ? p.dbId : null
      });
    }
  };


  function send(data) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(data));
  }
  function setStatus(msg) {
    var el = document.getElementById('status');
    if (el) el.textContent = msg;
  }

  function measurePage() {
    var win = document.getElementById('page-window');
    if (!win) return;
    win.style.height = '';
    var rawW = win.clientWidth;
    PW = Math.floor(rawW / 8) * 8;
    if (PW < 8) PW = rawW;
    PH = win.clientHeight;
  }

  /**
   * RN reflow virtual pages: Vh is the text band height (lh grid), stepped with overlap.
   * #page-window is NOT pixel-shortened anymore — pinning shorter than flex height caused top/bottom bisect
   * and a dead gap under the column; Vh is derived from the live inner band only.
   */
  function reflowGetMetrics() {
    var pw = document.getElementById('page-window');
    var lh = Math.max(14, Math.round(fontSize * lineHeight));
    var padT = epubReflowWinPadTop();
    var padB = epubReflowWinPadBot();
    if (pw && window.__epubReflowMode) {
      pw.style.height = '';
      try {
        void pw.offsetHeight;
      } catch (eClr) {}
    }
    var domBand = pw ? reflowPageWinInnerBandPx(pw) : null;
    var band =
      domBand != null && domBand > lh * 3
        ? domBand
        : (function () {
            var raw =
              typeof window.__epubReflowNaturalVh === 'number' && window.__epubReflowNaturalVh >= 16
                ? window.__epubReflowNaturalVh
                : pw
                  ? Math.max(1, pw.clientHeight)
                  : Math.max(PH, 1);
            return Math.max(lh * 3, raw - padT - padB);
          })();
    /* Keep ~2 lines slack inside the real clip (descenders + ascenders); rest snaps to lh grid. */
    var slackLines = epubReflowLand() ? 2.15 : 1.95;
    var usable = band - slackLines * lh;
    if (usable < lh * 2) usable = lh * 2;
    var Vh = Math.max(lh * 2, Math.floor(usable / lh) * lh);
    var step = Math.max(lh, Vh - 2 * lh);
    var natural = band;
    var reservePx = Math.max(0, Math.round(band - Vh));
    return { Vh: Vh, step: step, lh: lh, natural: natural, reservePx: reservePx };
  }

  /** Line box in viewport coords for a screen point (handles WebKit + Firefox APIs). */
  function reflowGetLineRectAtPoint(x, y) {
    var r = null;
    try {
      if (document.caretRangeFromPoint) {
        r = document.caretRangeFromPoint(x, y);
      } else if (document.caretPositionFromPoint) {
        var cp = document.caretPositionFromPoint(x, y);
        if (cp && cp.offsetNode) {
          var node = cp.offsetNode;
          if (node.nodeType !== 3) return null;
          var len = node.textContent.length;
          if (len < 1) return null;
          r = document.createRange();
          var o = Math.min(Math.max(0, cp.offset), len - 1);
          r.setStart(node, o);
          r.setEnd(node, o + 1);
        }
      }
    } catch (e0) {
      return null;
    }
    if (!r) return null;
    try {
      var rects = r.getClientRects();
      if (!rects || rects.length === 0) return null;
      var best = null;
      var bestD = 1e9;
      for (var i = 0; i < rects.length; i++) {
        if (rects[i].height < 1) continue;
        var mid = (rects[i].top + rects[i].bottom) / 2;
        var d = Math.abs(mid - y);
        if (d < bestD) {
          bestD = d;
          best = rects[i];
        }
      }
      if (!best) best = rects[0];
      return { top: best.top, bottom: best.bottom };
    } catch (e1) {
      return null;
    }
  }

  /**
   * Top inset for reflow body text inside #epub-content.
   * Must match html.epub-reflow #epub-content padding-top in applyOverrideSheet.
   * reflowSnapVerticalOffset uses pr.top + epubReflowWinPadTop() + this — win padding is outside #epub-content.
   */
  function epubReflowContentTopPadPx() {
    /* Extra px so ascenders / first line are not clipped by #page-window overflow:hidden (API 29+ WebView). */
    var lh = Math.round(fontSize * lineHeight);
    return Math.max(96, lh + 58) + Math.round(lh * 0.45);
  }

  /**
   * Minimum allowed viewport Y for the top of the first text linebox.
   * Must stay in sync with #epub-content padding-top (epubReflowContentTopPadPx). Old code used +20px
   * here, which let bottom-nudges raise translateY until ascenders clipped against #page-window.
   */
  function reflowMinFirstTextLineTop(pageWin) {
    if (!pageWin) return 0;
    try {
      var pr = pageWin.getBoundingClientRect();
      var winPadT = reflowPageWinPadTopPx(pageWin);
      var lhM = Math.max(14, Math.round(fontSize * lineHeight));
      return pr.top + winPadT + epubReflowContentTopPadPx() + Math.round(lhM * 0.22);
    } catch (eMinT) {
      return 0;
    }
  }

  /** First real glyph line box (viewport coords); does not depend on caretRangeFromPoint. */
  function reflowFirstTextLineRect(rootEl) {
    if (!rootEl) return null;
    try {
      var w = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
      var n;
      while (n = w.nextNode()) {
        if (!n.nodeValue || !n.nodeValue.replace(/\s+/g, '')) continue;
        var pe = n.parentElement;
        if (!pe) continue;
        if (pe.closest && pe.closest('script,style,noscript')) continue;
        var len = n.nodeValue.length;
        var i = 0;
        while (i < len && /\s/.test(n.nodeValue[i])) i++;
        if (i >= len) continue;
        var rg = document.createRange();
        rg.setStart(n, i);
        rg.setEnd(n, Math.min(i + 1, len));
        var rects = rg.getClientRects();
        if (!rects || !rects.length) continue;
        for (var j = 0; j < rects.length; j++) {
          if (rects[j].height >= 2 && rects[j].width >= 0.5) {
            return { top: rects[j].top, bottom: rects[j].bottom };
          }
        }
        if (rects[0].height > 0) return { top: rects[0].top, bottom: rects[0].bottom };
      }
    } catch (eFt) {
      return null;
    }
    return null;
  }

  /**
   * Top (smallest Y) of the first text line actually visible inside #page-window — viewport scan.
   * reflowFirstTextLineRect() is DOM-order first glyph (often off-screen when translateY & page>0).
   */
  function reflowFirstVisibleLineTopInWindow(pageWin, lh) {
    if (!pageWin) return null;
    try {
      var pr = pageWin.getBoundingClientRect();
      var winPadT = reflowPageWinPadTopPx(pageWin);
      var band = reflowPageWinInnerBandPx(pageWin);
      var depth = band != null ? Math.min(200, Math.max(48, band * 0.5)) : 140;
      var y0 = pr.top + winPadT + 2;
      var yEnd = y0 + depth;
      var x1 = pr.left + Math.max(12, pr.width * 0.12);
      var x2 = pr.left + pr.width * 0.38;
      var x3 = pr.left + Math.min(pr.width - 14, pr.width * 0.62);
      var best = null;
      for (var yy = y0; yy < yEnd; yy += 3) {
        for (var xi = 0; xi < 3; xi++) {
          var xp = xi === 0 ? x1 : xi === 1 ? x2 : x3;
          var rr = reflowGetLineRectAtPoint(xp, yy);
          if (rr && rr.height >= 2) {
            if (best == null || rr.top < best) best = rr.top;
          }
        }
      }
      return best;
    } catch (eFv) {
      return null;
    }
  }

  /** Minimum Y for first visible line top: chapter pad (p0) or ~0.62lh below inner top (continuation pages). */
  function reflowWantFirstVisibleLineTop(pageWin, rawOff, lh) {
    if (!pageWin) return 0;
    if (rawOff === 0) return reflowMinFirstTextLineTop(pageWin);
    try {
      var pr = pageWin.getBoundingClientRect();
      return pr.top + reflowPageWinPadTopPx(pageWin) + Math.round(lh * 0.92);
    } catch (eW) {
      return 0;
    }
  }

  /**
   * Nudge translateY so #page-window does not cut through glyph mid-line (top or bottom).
   * Grid math (step × page) cannot match real layout after headings / padding / subpixels.
   */
  function reflowSnapVerticalOffset(contentEl, pageWin, rawOff) {
    if (!contentEl || !pageWin) return Math.max(0, rawOff);
    if (!document.caretRangeFromPoint && !document.caretPositionFromPoint) {
      return Math.max(0, rawOff);
    }
    var off = Math.max(0, rawOff);
    var lh = Math.max(14, Math.round(fontSize * lineHeight));
    var tol = 2;
    var botTol = Math.max(6, Math.round(lh * (epubReflowLand() ? 0.22 : 0.12)));
    var maxIter = 14;
    for (var iter = 0; iter < maxIter; iter++) {
      contentEl.style.transform = 'translateY(-' + off + 'px)';
      contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
      try {
        void contentEl.offsetHeight;
      } catch (e2) {}
      var pr = pageWin.getBoundingClientRect();
      var winPadT = reflowPageWinPadTopPx(pageWin);
      var x = pr.left + Math.min(80, Math.max(14, pr.width * 0.12));
      var winPadB = reflowPageWinPadBottomPx(pageWin);
      var foldSlack = reflowFoldBottomSlackPx();
      var bandPr = reflowPageWinInnerBandPx(pageWin);
      var innerSafeBottom =
        bandPr != null ? pr.top + bandPr - foldSlack : pr.bottom - winPadB - foldSlack;
      var yBotProbe =
        innerSafeBottom -
        Math.min(epubReflowLand() ? 38 : 26, Math.max(epubReflowLand() ? 10 : 6, lh * (epubReflowLand() ? 0.44 : 0.32)));
      var moved = false;
      /*
       * Virtual page 0: first line must clear chapter top pad (epubReflowContentTopPadPx).
       * Virtual page > 0: NEVER use that offset — padding has scrolled away; comparing to it
       * wildly shifts translateY and bisects lines at both top and bottom (persistent RN bug).
       */
      var topR = null;
      if (rawOff === 0) {
        var targetTop = pr.top + winPadT + epubReflowContentTopPadPx();
        var yTopProbe = targetTop + Math.min(8, Math.max(2, pr.height * 0.02));
        topR = reflowGetLineRectAtPoint(x, yTopProbe);
        if (topR && topR.top < targetTop - tol) {
          off = Math.max(rawOff, off - Math.round(targetTop - topR.top));
          moved = true;
        }
      } else {
        var clipTop = pr.top + winPadT + Math.round(lh * 0.48);
        var yTopProbePg = clipTop + Math.min(26, Math.max(10, lh * 0.42));
        topR = reflowGetLineRectAtPoint(x, yTopProbePg);
        if (topR && topR.top < clipTop - tol) {
          off = Math.max(rawOff, off - Math.round(clipTop - topR.top));
          moved = true;
        } else if (topR && topR.top > clipTop + lh * 1.05 && topR.top - clipTop < lh * 1.2) {
          off = Math.max(rawOff, off + Math.round(topR.top - clipTop));
          moved = true;
        }
      }
      if (moved) {
        contentEl.style.transform = 'translateY(-' + off + 'px)';
        contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
        try {
          void contentEl.offsetHeight;
        } catch (e3) {}
        pr = pageWin.getBoundingClientRect();
      }
      /* Bottom of text must stay above inner clip (includes page 0 / single-page chapters). */
      var botR = reflowGetLineRectAtPoint(x, yBotProbe);
      if (botR && botR.bottom > innerSafeBottom + botTol) {
        off = Math.max(rawOff, off + Math.round(botR.bottom - innerSafeBottom));
        moved = true;
      }
      if (!moved) break;
    }
    /* Final guard: if first line still sits under the clip top, nudge translateY down. */
    contentEl.style.transform = 'translateY(-' + off + 'px)';
    contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
    try {
      void contentEl.offsetHeight;
    } catch (eG) {}
    if (rawOff === 0) {
      var prF = pageWin.getBoundingClientRect();
      var winPadTF = reflowPageWinPadTopPx(pageWin);
      var xF = prF.left + Math.min(80, Math.max(14, prF.width * 0.12));
      var minLineTopProbe = reflowMinFirstTextLineTop(pageWin);
      var probeY =
        prF.top + winPadTF + epubReflowContentTopPadPx() + Math.min(10, Math.max(4, prF.height * 0.03));
      var lr = reflowGetLineRectAtPoint(xF, probeY);
      if (lr && lr.top < minLineTopProbe - 2) {
        off = Math.max(rawOff, off - Math.ceil(minLineTopProbe - lr.top));
        contentEl.style.transform = 'translateY(-' + off + 'px)';
        contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
      }
      /* Hard floor virtual page 0 only: reflowFirstTextLineRect is DOM-first, not first-on-screen. */
      var minAsc = reflowMinFirstTextLineTop(pageWin);
      for (var g = 0; g < 20; g++) {
        contentEl.style.transform = 'translateY(-' + off + 'px)';
        contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
        try {
          void contentEl.offsetHeight;
        } catch (eG2) {}
        minAsc = reflowMinFirstTextLineTop(pageWin);
        var fl = reflowFirstTextLineRect(contentEl);
        if (!fl || fl.top >= minAsc - 0.25) break;
        off = Math.max(rawOff, off - Math.ceil(minAsc - fl.top));
      }
    }
    /* Bottom: last visible line must clear inner clip (multi X/Y — caret often misses the bisected line). */
    var winPadBF = reflowPageWinPadBottomPx(pageWin);
    var foldSlackB = reflowFoldBottomSlackPx();
    var xFracs = [0.09, 0.2, 0.34, 0.48, 0.62, 0.76];
    for (var bi = 0; bi < 20; bi++) {
      contentEl.style.transform = 'translateY(-' + off + 'px)';
      contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
      try {
        void contentEl.offsetHeight;
      } catch (eBi) {}
      var prB = pageWin.getBoundingClientRect();
      var bandB = reflowPageWinInnerBandPx(pageWin);
      var innerBot =
        bandB != null ? prB.top + bandB - foldSlackB : prB.bottom - winPadBF - foldSlackB;
      var movedB = false;
      for (var py = 0; py < 5 && !movedB; py++) {
        var yTry = innerBot - (2 + py * lh * 0.2);
        for (var xf = 0; xf < xFracs.length; xf++) {
          var xp = prB.left + Math.max(10, Math.min(prB.width - 12, prB.width * xFracs[xf]));
          var bLine = reflowGetLineRectAtPoint(xp, yTry);
          if (bLine && bLine.bottom > innerBot + botTol) {
            off = Math.max(rawOff, off + Math.ceil(bLine.bottom - innerBot));
            movedB = true;
            break;
          }
        }
      }
      if (!movedB) break;
    }
    /*
     * Every virtual page: enforce first *visible* line vs DOM-first (wrong for page>0).
     * Bottom nudges can push translateY up and bisect ascenders on any page.
     */
    for (var g2 = 0; g2 < 22; g2++) {
      contentEl.style.transform = 'translateY(-' + off + 'px)';
      contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
      try {
        void contentEl.offsetHeight;
      } catch (eG3) {}
      var wantTop = reflowWantFirstVisibleLineTop(pageWin, rawOff, lh);
      var fvTop = reflowFirstVisibleLineTopInWindow(pageWin, lh);
      if (wantTop < 1 || fvTop == null || fvTop >= wantTop - 0.5) break;
      var prevOff = off;
      off = Math.max(rawOff, off - Math.ceil(wantTop - fvTop));
      if (off === prevOff) break;
    }
    return off;
  }

  function reflowApplyPageTransform(contentEl) {
    if (!contentEl || !window.__epubReflowMode) return;
    var pw = document.getElementById('page-window');
    if (!pw) return;
    var m = reflowSyncPageCount(contentEl);
    if (totalPages < 1) totalPages = 1;
    currentPage = Math.max(0, Math.min(currentPage, totalPages - 1));
    var rawOff = currentPage * m.step;
    var off = reflowSnapVerticalOffset(contentEl, pw, rawOff);
    contentEl.style.transform = 'translateY(-' + off + 'px)';
    contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
  }

  function reflowSyncPageCount(contentEl) {
    var m = reflowGetMetrics();
    if (!contentEl) return m;
    var ch = contentEl.scrollHeight;
    if (ch <= m.Vh + 2) {
      totalPages = 1;
    } else {
      totalPages = Math.max(1, Math.ceil((ch - m.Vh) / m.step) + 1);
    }
    return m;
  }

  function applyOverrideSheet() {
    var textColor = darkMode ? '#e8e8e8' : '#1a1a1a';

            /* Priority 5: toggle buttons on short tap */
            if (dt < 400 && adx < 15 && ady < 15) {
              setTimeout(function () {
                if (hlClickHandled) return;
                var sel = window.getSelection();
                var text = sel ? sel.toString().trim() : '';
                if (!text || text.length < 2) send({ type: 'toggleButtons' });
              }, 150);
            }
          }

          document.addEventListener('touchend', function (e) {
            var ct = e.changedTouches[0];
            var ex = ct ? ct.clientX : touchSx;
            var ey = ct ? ct.clientY : touchSy;
            var dt = Date.now() - touchStartTime;
            handleGestureEnd(ex, ey, dt);
          }, { passive: true });

          /* Emulator mouse: Android WebView often delivers mouse as pointer/mouse, not touch. */
          document.addEventListener('pointerdown', function (e) {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            touchSx = e.clientX;
            touchSy = e.clientY;
            touchStartTime = Date.now();
            hlClickHandled = false;
            touchStartHl = findHlFromEl(e.target);
            if (!touchStartHl) {
              touchStartHl = findHlFromEl(document.elementFromPoint(e.clientX, e.clientY));
            }
          }, true);

          document.addEventListener('pointerup', function (e) {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            var dt = Date.now() - touchStartTime;
            handleGestureEnd(e.clientX, e.clientY, dt);
          }, true);

          /* Keyboard: page turns within chapter; chapter change only at first/last page */
          document.addEventListener('keydown', function (e) {
            var k = e.key;
            if (k === 'ArrowDown' || k === 'PageDown' || k === 'ArrowRight' || k === 'j' || k === 'J') {
              e.preventDefault();
              goNext();
            } else if (k === 'ArrowUp' || k === 'PageUp' || k === 'ArrowLeft' || k === 'k' || k === 'K') {
              e.preventDefault();
              goPrev();
            }
          }, false);

          var wheelLock = false;
          document.getElementById('reader').addEventListener('wheel', function (e) {
            if (Math.abs(e.deltaY) < 12) return;
            e.preventDefault();
            if (wheelLock) return;
            wheelLock = true;
            if (e.deltaY > 0) goNext(); else goPrev();
            setTimeout(function () { wheelLock = false; }, 280);
          }, { passive: false });

          /* ── Text selection (same pattern as PDF reader) ── */
          var pendingSelection = null;

          function sendPendingSelection() {
            if (!pendingSelection || pendingSelection.length < 2) return;
            var text = pendingSelection;
            pendingSelection = null;

            for (var key in highlightMap) {
              var ent = highlightMap[key];
              var ht = (ent && ent.text) ? String(ent.text).trim() : '';
              if (ht && (text === ht || text.indexOf(ht) >= 0 || ht.indexOf(text) >= 0)) {
                send({ type: 'highlightClicked', text: text, cfi: ent.cfi || '', color: ent.color || '', dbId: ent.dbId || null });
                return;
              }
            }
            var cfi = 'section-' + currentSectionIndex + '-page-' + currentPage;
            send({ type: 'textSelected', text: text, cfi: cfi });
          }

          document.addEventListener('selectionchange', function () {
            var sel = window.getSelection();
            var text = sel ? sel.toString().trim() : '';
            if (text && text.length > 1) {
              pendingSelection = text;
            }
          });
        } catch (e) {
          send({ type:'error', message: (e&&e.message)||'Reader init failed' });
        }
      }).catch(function (err) {
        send({ type:'error', message:(err&&err.message)||'book.ready failed' });
      });
    } catch (err) {
      send({ type:'error', message:(err&&err.message)||'ePub() failed' });
    }
  }

  /** After #reader padding / viewport chrome changes — reflow must re-pin Vh from #page-window.clientHeight. */
  function remeasureReflowAfterLayoutChromeChange() {
    if (!window.__epubReflowMode) return false;
    var pwF = document.getElementById('page-window');
    if (pwF) {
      pwF.style.height = '';
      try {
        void pwF.offsetHeight;
      } catch (eF) {}
      window.__epubReflowNaturalVh = Math.max(1, pwF.clientHeight);
    }
    measurePage();
    var elFs = document.getElementById('epub-content');
    if (elFs) {
      var prevPg = currentPage;
      reflowSyncPageCount(elFs);
      currentPage = Math.min(prevPg, totalPages - 1);
      currentPage = Math.max(0, currentPage);
      reflowApplyPageTransform(elFs);
    }
    sendLocation();
    return true;
  }

  function handleCommand(msg) {
    if (!msg || typeof msg !== 'object') return;
    var c = msg.command;
    if (c === 'next') goNext();
    else if (c === 'prev') goPrev();
    else if (c === 'goToSection' && msg.sectionIndex != null) {
      var idx = parseInt(msg.sectionIndex, 10);
      var anc = (typeof msg.anchor === 'string' && msg.anchor) ? msg.anchor : null;
      var tit = (typeof msg.title === 'string' && msg.title) ? msg.title : null;
      send({ type: 'debug', msg: 'goToSection idx=' + idx + ' anchor=' + (anc || '') + ' title=' + (tit ? tit.substring(0, 40) : '') });
      if (!isNaN(idx) && idx >= 0 && idx < spineItems.length) {
        showSection(idx, false, anc, tit);
      }
    }
    else if (c === 'setFontSize' && msg.size) {
      fontSize = msg.size; applyOverrideSheet();
      if (window.__epubReflowMode) {
        remeasureReflowAfterLayoutChromeChange();
        return;
      }
      paginate(function () { showPage(currentPage); });
    }
    else if (c === 'setSafeInsets') {
      var rt = typeof msg.top === 'number' && isFinite(msg.top) ? msg.top : 0;
      var rr = typeof msg.right === 'number' && isFinite(msg.right) ? msg.right : 0;
      var rb = typeof msg.bottom === 'number' && isFinite(msg.bottom) ? msg.bottom : 0;
      var rl = typeof msg.left === 'number' && isFinite(msg.left) ? msg.left : 0;
      document.documentElement.style.setProperty('--rn-safe-top', rt + 'px');
      document.documentElement.style.setProperty('--rn-safe-right', rr + 'px');
      document.documentElement.style.setProperty('--rn-safe-bottom', rb + 'px');
      document.documentElement.style.setProperty('--rn-safe-left', rl + 'px');
      if (window.__epubReflowMode) {
        remeasureReflowAfterLayoutChromeChange();
        return;
      }
      measurePage();
      paginate(function () { showPage(currentPage); });
    }
    else if (c === 'setReaderChrome') {
      /* RN: inline !important — clamp vertical padding so #page-window keeps room for body text. */
      var rChrome = document.getElementById('reader');
      if (rChrome) {
        var ih = 0;
        try {
          ih = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 0;
        } catch (eIh) {
          ih = 0;
        }
        if (ih < 1) ih = 640;
        var landscape = false;
        try {
          landscape = window.innerWidth > window.innerHeight + 1;
        } catch (eOr) {}
        var minTextBand;
        var maxChromeV;
        if (window.__epubReflowMode) {
          /* Landscape has a short innerHeight — old clamp stripped #reader padding and clipped the first line. */
          minTextBand = Math.max(96, Math.round(ih * (landscape ? 0.14 : 0.2)));
          /* Higher floor in landscape so RN bottom chrome + nav bar is not scaled away (tablet bisected last line). */
          maxChromeV = Math.max(landscape ? 172 : 100, ih - minTextBand);
        } else {
          minTextBand = Math.max(160, Math.round(ih * (landscape ? 0.26 : 0.34)));
          maxChromeV = Math.max(80, ih - minTextBand);
        }
        var pt = msg.paddingTopPx != null && isFinite(msg.paddingTopPx) ? Math.max(0, msg.paddingTopPx) : null;
        var pb = msg.paddingBottomPx != null && isFinite(msg.paddingBottomPx) ? Math.max(0, msg.paddingBottomPx) : null;
        if (pt != null && pb != null && pt + pb > maxChromeV) {
          var s = maxChromeV / (pt + pb);
          pt = Math.max(0, Math.floor(pt * s));
          pb = Math.max(0, Math.floor(pb * s));
        } else if (pt != null && pt > maxChromeV) {
          pt = Math.floor(maxChromeV * 0.55);
        } else if (pb != null && pb > maxChromeV) {
          pb = Math.floor(maxChromeV * 0.55);
        }
        if (pt != null) {
          rChrome.style.setProperty('padding-top', pt + 'px', 'important');
        }
        if (pb != null) {
          rChrome.style.setProperty('padding-bottom', pb + 'px', 'important');
        }
        if (msg.paddingLeftPx != null && isFinite(msg.paddingLeftPx)) {
          rChrome.style.setProperty('padding-left', Math.max(0, msg.paddingLeftPx) + 'px', 'important');
        }
        if (msg.paddingRightPx != null && isFinite(msg.paddingRightPx)) {
          rChrome.style.setProperty('padding-right', Math.max(0, msg.paddingRightPx) + 'px', 'important');
        }
      }
      if (window.__epubReflowMode) {
        remeasureReflowAfterLayoutChromeChange();
        return;
      }
      measurePage();
      paginate(function () { showPage(currentPage); });
    }
    else if (c === 'remeasureReflow') {
      if (window.__epubReflowMode) {
        remeasureReflowAfterLayoutChromeChange();
        return;
      }
      measurePage();
      paginate(function () { showPage(currentPage); });
    }
    else if (c === 'setTheme') {
      darkMode = !!msg.dark;
      applyOverrideSheet();
    }
    else if (c === 'addHighlight') {
      send({ type: 'debug', msg: 'CMD addHighlight cfi=' + msg.cfi + ' text="' + (msg.text||'').substring(0,30) + '"' });
      if (msg.cfi != null) {
        var addKey = String(msg.cfi);
        if (addKey) highlightMap[addKey] = msg;
      }
      var contentEl = document.getElementById('epub-content');
      if (contentEl) {
        applyHighlightsInContent(contentEl);
        if (window.__epubReflowMode) sendLocation();
        else paginate(function () { showPage(currentPage); });
      }
    }
    else if (c === 'removeHighlight') {
      if (msg.cfi != null) delete highlightMap[String(msg.cfi)];
      var sIdx = currentSectionIndex;
      showSection(sIdx, false);
    }
    else if (c === 'updateHighlightColor' && msg.cfi != null) {
      var updateKey = String(msg.cfi);
      if (highlightMap[updateKey]) highlightMap[updateKey].color = msg.color;
    }
    else if (c === 'clearSelection') {
      try { window.getSelection().removeAllRanges(); } catch(_){}
    }
    else if (c === 'restoreHighlights' && Array.isArray(msg.highlights)) {
      send({ type: 'debug', msg: 'CMD restoreHighlights: ' + msg.highlights.length + ' items' });
      msg.highlights.forEach(function (h) {
        if (!h || h.cfi == null) return;
        var restoreKey = String(h.cfi);
        if (restoreKey) highlightMap[restoreKey] = h;
      });
      send({ type: 'debug', msg: 'highlightMap keys: ' + Object.keys(highlightMap).join(', ') });
      var contentEl = document.getElementById('epub-content');
      if (contentEl) {
        applyHighlightsInContent(contentEl);
        if (window.__epubReflowMode) sendLocation();
        else paginate(function () { showPage(currentPage); });
      }
    }
  }

  window.startReader = startReader;
  window.handleEpubCommand = handleCommand;
  window.addEventListener('message', function (e) { try { handleCommand(JSON.parse(e.data)); } catch (_) {} });
  document.addEventListener('message', function (e) { try { handleCommand(JSON.parse(e.data)); } catch (_) {} });

  if (typeof ePub !== 'undefined') {
    setStatus('Ready…'); send({ type: 'ready' });
  } else {
    window.addEventListener('load', function () {
      if (typeof ePub !== 'undefined') { setStatus('Ready…'); send({ type: 'ready' }); }
      else send({ type: 'error', message: 'epub.js failed to load' });
    });
  }

  window.addEventListener('resize', function () {
    try {
      if (epubReflowResizeTimer) clearTimeout(epubReflowResizeTimer);
    } catch (eRz) {}
    epubReflowResizeTimer = setTimeout(function () {
      epubReflowResizeTimer = null;
      handleEpubViewportRelayout();
    }, 110);
  });
  window.addEventListener('orientationchange', function () {
    try {
      if (epubReflowResizeTimer) clearTimeout(epubReflowResizeTimer);
    } catch (eOc) {}
    epubReflowResizeTimer = setTimeout(function () {
      epubReflowResizeTimer = null;
      handleEpubViewportRelayout();
    }, 220);
  });
})();
</script>
</body>
</html>
