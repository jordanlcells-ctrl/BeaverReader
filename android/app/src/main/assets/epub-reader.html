<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EPUB Reader</title>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg, #fff); }
    #reader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      padding: 16px 48px;
      /* Extra top/bottom so status bar + 3-button nav / gesture bar do not cover text */
      padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
      overflow: hidden;
      touch-action: pan-x pinch-zoom;
      -webkit-user-select: text; user-select: text;
    }
    #page-window {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
    }
    #epub-content {
      position: absolute; top: 0; left: 0;
      will-change: transform; transition: opacity 0.15s ease-out;
    }
    #status {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); left: 0; right: 0;
      text-align: center; font-family: -apple-system, sans-serif;
      font-size: 12px; color: #bbb; pointer-events: none;
    }
    .epub-hl {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: rgba(0,0,0,0.15);
      pointer-events: auto !important;
      cursor: pointer !important;
    }
  </style>
</head>
<body>
<div id="reader">
  <div id="page-window">
    <div id="epub-content"></div>
  </div>
</div>
<div id="status">Loading…</div>
<script>
(function () {
  var book = null;
  var spineItems = [];
  var currentSectionIndex = 0;
  var currentPage = 0;
  var totalPages = 1;
  var highlightMap = {};
  var sectionLoading = false;
  var sectionLoadId = 0;
  var fontSize = 18;
  var lineHeight = 1.65;
  var PW = 0, PH = 0;
  var sectionRestorePage = null;
  var pendingRestorePage = null;
  var waitingForImageRestore = false;
  var darkMode = false;
  var showContentTimer = null;
  /** When true (after TOC goToSection): one column, vertical scroll — avoids broken multi-column + translateX in WebView. */
  window.__epubReflowMode = false;

  /* Highlight click support */
  window._epubHighlightById = {};
  window.handleEpubHighlightClick = function (id) {
    var p = window._epubHighlightById && window._epubHighlightById[id];
    if (p) {
      send({
        type: 'highlightClicked',
        text: p.text || '', cfi: p.cfi || '',
        color: p.color || '', dbId: p.dbId != null ? p.dbId : null
      });
    }
  };


  function send(data) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(data));
  }
  function setStatus(msg) {
    var el = document.getElementById('status');
    if (el) el.textContent = msg;
  }

  function measurePage() {
    var win = document.getElementById('page-window');
    if (!win) return;
    /* Reflow pins #page-window height to a whole number of line-heights; do not clear it mid-session. */
    if (!window.__epubReflowMode) win.style.height = '';
    PW = win.clientWidth;
    PH = win.clientHeight;
  }

  /**
   * RN reflow virtual pages: Vh and step are exact multiples of lh (same as CSS line-height on body text).
   * Viewport top/bottom then land on the line grid so glyphs are not bisected on some pages only.
   */
  function reflowGetMetrics() {
    var pw = document.getElementById('page-window');
    var lh = Math.max(14, Math.round(fontSize * lineHeight));
    if (!pw) {
      var Vh0 = Math.max(lh * 2, Math.floor(Math.max(PH, 1) / lh) * lh);
      var step0 = Math.max(lh, Vh0 - lh);
      return { Vh: Vh0, step: step0, lh: lh };
    }
    var rawVh = Math.max(1, pw.clientHeight);
    var Vh = Math.max(lh * 2, Math.floor(rawVh / lh) * lh);
    var step = Math.max(lh, Vh - lh);
    if (window.__epubReflowMode) {
      pw.style.height = Vh + 'px';
    }
    return { Vh: Vh, step: step, lh: lh, rawVh: rawVh };
  }

  function reflowApplyPageTransform(contentEl) {
    if (!contentEl || !window.__epubReflowMode) return;
    var m = reflowSyncPageCount(contentEl);
    if (totalPages < 1) totalPages = 1;
    currentPage = Math.max(0, Math.min(currentPage, totalPages - 1));
    var off = currentPage * m.step;
    contentEl.style.transform = 'translateY(-' + off + 'px)';
    contentEl.style.webkitTransform = 'translateY(-' + off + 'px)';
  }

  function reflowSyncPageCount(contentEl) {
    var m = reflowGetMetrics();
    if (!contentEl) return m;
    var ch = contentEl.scrollHeight;
    if (ch <= m.Vh + 2) {
      totalPages = 1;
    } else {
      totalPages = Math.max(1, Math.ceil((ch - m.Vh) / m.step) + 1);
    }
    return m;
  }

  function applyOverrideSheet() {
    var textColor = darkMode ? '#e8e8e8' : '#1a1a1a';
    var bgColor   = darkMode ? '#1a1a1a' : '#ffffff';
    var linkColor = darkMode ? '#7eb8e8' : '#007AFF';
    document.documentElement.style.setProperty('--bg', bgColor);
    document.body.style.background = bgColor;
    var s = document.getElementById('epub-override');
    if (!s) { s = document.createElement('style'); s.id = 'epub-override'; document.head.appendChild(s); }
    s.textContent =
      '#epub-content {' +
        'box-sizing:border-box !important;width:100% !important;max-width:100% !important;min-width:0 !important;' +
        'overflow-wrap:break-word !important;word-wrap:break-word !important;word-break:break-word !important;' +
        'white-space:normal !important;padding:0 !important;' +
      '}' +
      '#epub-content p,#epub-content div,#epub-content section,#epub-content article,#epub-content aside,' +
      '#epub-content li,#epub-content td,#epub-content th,#epub-content blockquote,#epub-content span,' +
      '#epub-content dt,#epub-content dd,#epub-content figcaption {' +
        'max-width:100% !important;overflow-wrap:break-word !important;word-break:break-word !important;' +
        'box-sizing:border-box !important;min-width:0 !important;margin:0 !important;' +
      '}' +
      /* paragraph spacing via padding-bottom (not margin) keeps all line-starts at exact
         multiples of lh, which is required for the snap-to-lh clipping to work correctly. */
      '#epub-content p,#epub-content li {padding-bottom:1.65em !important;}' +
      '#epub-content svg { max-width:100% !important;height:auto !important; }' +
      '#epub-content pre,#epub-content code {' +
        'white-space:pre-wrap !important;word-break:break-word !important;max-width:100% !important;' +
      '}' +
      '#epub-content table { table-layout:fixed !important;width:100% !important;max-width:100% !important; }' +
      '#epub-content img, #epub-content video { max-width:100% !important;height:auto !important; }' +
      '#epub-content, #epub-content p, #epub-content div,' +
      '#epub-content li, #epub-content td, #epub-content blockquote {' +
        'font-size:' + fontSize + 'px !important;' +
        'line-height:' + lineHeight + ' !important;' +
        'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important;' +
        'color:' + textColor + ' !important; background:transparent !important; max-width:100% !important;' +
      '}' +
      '#epub-content span:not(.epub-hl) { background:transparent !important; color:inherit !important; }' +
      '#epub-content h1,#epub-content h2,#epub-content h3,#epub-content h4 {' +
        'font-size:' + Math.round(fontSize * 1.25) + 'px !important;' +
        'line-height:1.3 !important; margin:0 !important; padding-bottom:1.65em !important; color:' + textColor + ' !important;' +
      '}' +
      '#epub-content img {' +
        'max-width:100% !important; max-height:' + Math.round(PH * 0.8) + 'px !important;' +
        'object-fit:contain !important; display:block !important;' +
        'break-inside:avoid !important; margin:6px auto !important;' +
      '}' +
      '#epub-content a { color:' + linkColor + ' !important; }' +
      '#epub-content em,#epub-content i { font-style:italic !important; }' +
      '#epub-content strong,#epub-content b { font-weight:bold !important; }' +
      'html.epub-reflow #epub-content{padding-bottom:' + Math.round(fontSize * lineHeight + 28) + 'px !important;}';
  }

  /* DOM-based text highlighting: finds text across HTML tags using TreeWalker + Range */
  function wrapTextInDOM(root, searchText, color, cfi, dbId, hlId) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var textNodes = [];
    var n;
    while (n = walker.nextNode()) {
      if (n.parentElement && n.parentElement.classList && n.parentElement.classList.contains('epub-hl')) continue;
      textNodes.push(n);
    }
    if (!textNodes.length) return false;

    var fullText = '';
    var segs = [];
    for (var i = 0; i < textNodes.length; i++) {
      var t = textNodes[i].textContent || '';
      segs.push({ node: textNodes[i], start: fullText.length, end: fullText.length + t.length });
      fullText += t;
    }

    var matchStart = -1, matchLen = searchText.length;

    matchStart = fullText.indexOf(searchText);
    if (matchStart < 0) matchStart = fullText.toLowerCase().indexOf(searchText.toLowerCase());

    if (matchStart < 0) {
      var ns = searchText.replace(/\s+/g, ' ').trim().toLowerCase();
      var si = 0, anchor = -1, lastFi = 0;
      for (var fi = 0; fi < fullText.length && si < ns.length; fi++) {
        var fc = fullText[fi].toLowerCase();
        var sc = ns[si];
        if (/\s/.test(fc) && /\s/.test(sc)) {
          if (anchor < 0) anchor = fi;
          while (fi + 1 < fullText.length && /\s/.test(fullText[fi + 1])) fi++;
          while (si + 1 < ns.length && /\s/.test(ns[si + 1])) si++;
          si++; lastFi = fi + 1;
        } else if (fc === sc) {
          if (anchor < 0) anchor = fi;
          si++; lastFi = fi + 1;
        } else if (/\s/.test(fc)) {
          continue;
        } else {
          si = 0; anchor = -1;
        }
      }
      if (si >= ns.length && anchor >= 0) {
        matchStart = anchor; matchLen = lastFi - anchor;
      }
    }

    if (matchStart < 0) return false;
    var matchEnd = matchStart + matchLen;

    var startNode, startOff, endNode, endOff;
    for (var i = 0; i < segs.length; i++) {
      if (startNode == null && segs[i].end > matchStart) {
        startNode = segs[i].node; startOff = matchStart - segs[i].start;
      }
      if (segs[i].end >= matchEnd) {
        endNode = segs[i].node; endOff = matchEnd - segs[i].start;
        break;
      }
    }
    if (!startNode || !endNode) return false;

    try {
      var range = document.createRange();
      range.setStart(startNode, Math.min(startOff, startNode.length));
      range.setEnd(endNode, Math.min(endOff, endNode.length));

      var span = document.createElement('span');
      span.className = 'epub-hl';
      span.setAttribute('data-cfi', cfi);
      span.setAttribute('data-color', color);
      span.setAttribute('data-dbid', dbId || '');
      span.style.cssText = 'background-color:' + color + ' !important;cursor:pointer;position:relative;z-index:2';
      span.setAttribute('data-hlid', hlId);

      if (startNode === endNode) {
        range.surroundContents(span);
      } else {
        var frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }

      /* Attach direct event listeners to this span */
      (function(s, hid) {
        s.addEventListener('click', function(ev) {
          ev.stopPropagation();
          ev.preventDefault();
          var p = window._epubHighlightById && window._epubHighlightById[hid];
          if (p) {
            send({ type: 'highlightClicked', text: p.text||'', cfi: p.cfi||'', color: p.color||'', dbId: p.dbId });
          } else {
            send({ type: 'highlightClicked', text: (s.textContent||'').trim(), cfi: s.getAttribute('data-cfi')||'', color: s.getAttribute('data-color')||'', dbId: s.getAttribute('data-dbid')||null });
          }
        }, false);
        s.addEventListener('touchend', function(ev) {
          ev.stopPropagation();
          var p = window._epubHighlightById && window._epubHighlightById[hid];
          if (p) {
            send({ type: 'highlightClicked', text: p.text||'', cfi: p.cfi||'', color: p.color||'', dbId: p.dbId });
          } else {
            send({ type: 'highlightClicked', text: (s.textContent||'').trim(), cfi: s.getAttribute('data-cfi')||'', color: s.getAttribute('data-color')||'', dbId: s.getAttribute('data-dbid')||null });
          }
        }, false);
      })(span, hlId);

      return true;
    } catch (e) {
      send({ type: 'debug', msg: 'wrapText err: ' + (e.message || e) });
      return false;
    }
  }

  function applyHighlightsInContent(contentEl) {
    if (!contentEl) return;
    try {
      window._epubHighlightById = {};
      var hlCounter = 0;
      var sectionPrefix = 'section-' + currentSectionIndex + '-';
      var entries = [];
      for (var cfi in highlightMap) {
        if (!Object.prototype.hasOwnProperty.call(highlightMap, cfi)) continue;
        var cfiKey = (cfi != null) ? String(cfi) : '';
        if (!cfiKey) continue;
        var matchesSection = cfiKey.indexOf(sectionPrefix) === 0;
        var isFallback = cfiKey.indexOf('epub-hl-') === 0;
        if (matchesSection || isFallback) entries.push({ cfi: cfiKey, data: highlightMap[cfi] });
      }
      send({ type: 'debug', msg: 'applyHL: ' + entries.length + ' entries, section=' + currentSectionIndex + ', mapKeys=' + Object.keys(highlightMap).join(',') });
      if (entries.length === 0) return;

      for (var i = 0; i < entries.length; i++) {
        var ecfi = entries[i].cfi;
        var d = entries[i].data;
        if (!d) continue;
        var rawText = (d.text != null) ? String(d.text).trim() : '';
        if (!rawText || rawText.length < 2) continue;
        var color = d.color || '#ffeb3b';
        var dbId = d.dbId != null ? String(d.dbId) : '';
        var id = 'ehl' + (hlCounter++);
        window._epubHighlightById[id] = { text: rawText, cfi: ecfi, color: color, dbId: dbId || null };
        var ok = wrapTextInDOM(contentEl, rawText, color, ecfi, dbId, id);
        send({ type: 'debug', msg: 'HL ' + (ok ? 'OK' : 'MISS') + ': "' + rawText.substring(0, 40) + '"' });
      }
      var hlSpans = contentEl.querySelectorAll('.epub-hl').length;
      send({ type: 'debug', msg: 'applyHL done: ' + hlSpans + ' spans in DOM' });
    } catch (err) {
      send({ type: 'debug', msg: 'applyHL error: ' + (err.message || err) });
    }
  }

  var paginateRetryCount = 0;
  function paginate(callback) {
    /* RN: multi-column pagination blanks text in WebView; reflow + virtual pages instead. */
    if (typeof window.ReactNativeWebView !== 'undefined') {
      measurePage();
      if (callback) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { callback(); });
        });
      }
      return;
    }
    var el = document.getElementById('epub-content');
    var pageWin0 = document.getElementById('page-window');
    var reader0 = document.getElementById('reader');
    if (!el) return;
    window.__epubReflowMode = false;
    document.documentElement.classList.remove('epub-reflow');
    if (reader0) reader0.style.touchAction = 'pan-x pinch-zoom';
    if (pageWin0) {
      pageWin0.style.overflowY = 'hidden';
      pageWin0.style.overflowX = 'hidden';
      pageWin0.style.touchAction = '';
      pageWin0.style.scrollPaddingBottom = '';
      pageWin0.style.scrollPaddingTop = '';
      pageWin0.scrollTop = 0;
    }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        measurePage();
        /* WebView can report 0×0 until layout; dividing by PW breaks totalPages (Infinity) and hides all text. */
        if (PW < 8 || PH < 8) {
          if (paginateRetryCount < 8) {
            paginateRetryCount++;
            setTimeout(function () { paginate(callback); }, 48);
            return;
          }
          paginateRetryCount = 0;
          PW = Math.max(PW, 360);
          PH = Math.max(PH, 480);
        } else {
          paginateRetryCount = 0;
        }
        /* Reset reflow-era inline styles so column pagination measures correctly */
        el.style.position = 'absolute';
        el.style.top = '0';
        el.style.left = '0';
        el.style.maxWidth = '';
        el.style.minHeight = '';
        el.style.minWidth = '';
        el.style.paddingBottom = '';
        el.style.overflow = '';
        el.style.visibility = '';
        el.style.willChange = 'transform';
        el.style.webkitTransform = '';
        el.style.transform = 'translateX(0)';
        el.style.columnCount = '';
        el.style.webkitColumnCount = '';
        el.style.columnWidth = '';
        el.style.webkitColumnWidth = '';
        var maxCols = 500;
        el.style.width = (maxCols * PW) + 'px';
        el.style.height = PH + 'px';
        el.style.columnWidth = PW + 'px';
        el.style.webkitColumnWidth = PW + 'px';
        el.style.columnGap = '0px';
        el.style.webkitColumnGap = '0px';
        el.style.columnFill = 'auto';
        el.style.webkitColumnFill = 'auto';
        el.style.wordWrap = 'break-word';
        el.style.wordBreak = 'break-word';
        el.style.overflowX = 'visible';
        el.style.overflowY = 'visible';
        function measure() {
          var totalW = el.scrollWidth;
          var denom = Math.max(PW, 1);
          var tp = Math.ceil(totalW / denom);
          if (!isFinite(tp) || tp < 1) tp = 1;
          if (tp > 5000) tp = 5000;
          totalPages = tp;
        }
        measure();
        var plainLen = (el.textContent || '').replace(/\s+/g, ' ').trim().length;
        var needsWideRemeasure = totalPages <= 1 && plainLen > 400 && el.scrollHeight > PH * 1.12;
        if (needsWideRemeasure) {
          setTimeout(function () {
            measure();
            if (callback) callback();
          }, 120);
        } else if (totalPages === 1 && el.scrollHeight > PH * 1.5) {
          setTimeout(function () { measure(); if (callback) callback(); }, 80);
        } else {
          if (callback) callback();
        }
      });
    });
  }

  function sendLocation() {
    var pct = spineItems.length > 1 ? currentSectionIndex / (spineItems.length - 1) : 1;
    var cfi = 'section-' + currentSectionIndex + '-page-' + currentPage;
    send({ type: 'locationChanged', cfi: cfi, percentage: pct });
  }

  function showPage(idx) {
    if (window.__epubReflowMode) {
      var elR = document.getElementById('epub-content');
      if (!elR) { sendLocation(); return; }
      reflowSyncPageCount(elR);
      if (idx < 0) idx = 0;
      if (idx >= totalPages) idx = totalPages - 1;
      currentPage = idx;
      reflowApplyPageTransform(elR);
      sendLocation();
      return;
    }
    if (idx < 0) idx = 0;
    if (idx >= totalPages) idx = totalPages - 1;
    currentPage = idx;
    var el = document.getElementById('epub-content');
    if (el) el.style.transform = 'translateX(-' + (idx * PW) + 'px)';
    sendLocation();
  }

  function goNext() {
    if (sectionLoading) return;
    if (window.__epubReflowMode) {
      var elN = document.getElementById('epub-content');
      if (!elN) return;
      reflowSyncPageCount(elN);
      if (currentPage < totalPages - 1) {
        currentPage++;
        reflowApplyPageTransform(elN);
        sendLocation();
      } else {
        showSection(currentSectionIndex + 1, false, null, null);
      }
      return;
    }
    if (currentPage < totalPages - 1) showPage(currentPage + 1);
    else showSection(currentSectionIndex + 1, false);
  }
  function goPrev() {
    if (sectionLoading) return;
    if (window.__epubReflowMode) {
      var elP = document.getElementById('epub-content');
      if (!elP) return;
      reflowSyncPageCount(elP);
      if (currentPage > 0) {
        currentPage--;
        reflowApplyPageTransform(elP);
        sendLocation();
      } else {
        showSection(currentSectionIndex - 1, true, null, null);
      }
      return;
    }
    if (currentPage > 0) showPage(currentPage - 1);
    else showSection(currentSectionIndex - 1, true);
  }

  function stripEpubStyles(html) {
    html = html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
    html = html.replace(/<link[^>]+stylesheet[^>]*\/?>\s*/gi, '');
    html = html.replace(/\sstyle="([^"]*)"/gi, function (match, styles) {
      var cleaned = styles
        .replace(/font-size\s*:[^;]+;?/gi, '')
        .replace(/line-height\s*:[^;]+;?/gi, '')
        .replace(/color\s*:[^;]+;?/gi, '')
        .replace(/font-family\s*:[^;]+;?/gi, '')
        .replace(/width\s*:[^;]+;?/gi, '')
        .replace(/min-width\s*:[^;]+;?/gi, '')
        .replace(/max-width\s*:[^;]+;?/gi, '')
        .replace(/white-space\s*:[^;]+;?/gi, '').trim();
      return cleaned ? ' style="' + cleaned + '"' : '';
    });
    return html;
  }

  function resolvePath(base, rel) {
    if (!rel) return '';
    var dir = base ? base.replace(/[^/]+$/, '') : '';
    var parts = (dir + rel).replace(/\\/g, '/').split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === '..') out.pop();
      else if (parts[i] !== '.' && parts[i] !== '') out.push(parts[i]);
    }
    return out.join('/');
  }

  var imageLoadPaginateTimer = null;
  function scheduleImageLoadPaginate() {
    if (imageLoadPaginateTimer) clearTimeout(imageLoadPaginateTimer);
    imageLoadPaginateTimer = setTimeout(function () {
      imageLoadPaginateTimer = null;
      if (window.__epubReflowMode) {
        var elI = document.getElementById('epub-content');
        if (elI) {
          var keepPg = currentPage;
          reflowSyncPageCount(elI);
          currentPage = Math.min(keepPg, totalPages - 1);
          currentPage = Math.max(0, currentPage);
          reflowApplyPageTransform(elI);
        } else {
          measurePage();
        }
        sendLocation();
        return;
      }
      var restoreTo = pendingRestorePage;
      var wasWaiting = waitingForImageRestore;
      var wasAtEnd = (currentPage >= totalPages - 1);
      var oldTotal = totalPages;
      paginate(function () {
        if (restoreTo !== null && restoreTo >= 0 && restoreTo < totalPages) {
          currentPage = restoreTo;
          pendingRestorePage = null;
          waitingForImageRestore = false;
        } else if (wasAtEnd) {
          currentPage = totalPages - 1;
        } else if (totalPages !== oldTotal && oldTotal > 1) {
          currentPage = Math.min(Math.round(currentPage * totalPages / oldTotal), totalPages - 1);
        }
        var el = document.getElementById('epub-content');
        if (el) el.style.transform = 'translateX(-' + (currentPage * PW) + 'px)';
        if (wasWaiting) {
          if (el) el.style.opacity = '1';
          setStatus('');
          sectionLoading = false;
          send({ type: 'bookReady' });
        }
        sendLocation();
      });
    }, 200);
  }

  function loadImages(el, baseHref) {
    var zip = book.archive && book.archive.zip;
    var imgs = el.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) {
      (function (img) {

            if (!pendingSelection || pendingSelection.length < 2) return;
            var text = pendingSelection;
            pendingSelection = null;

            for (var key in highlightMap) {
              var ent = highlightMap[key];
              var ht = (ent && ent.text) ? String(ent.text).trim() : '';
              if (ht && (text === ht || text.indexOf(ht) >= 0 || ht.indexOf(text) >= 0)) {
                send({ type: 'highlightClicked', text: text, cfi: ent.cfi || '', color: ent.color || '', dbId: ent.dbId || null });
                return;
              }
            }
            var cfi = 'section-' + currentSectionIndex + '-page-' + currentPage;
            send({ type: 'textSelected', text: text, cfi: cfi });
          }

          document.addEventListener('selectionchange', function () {
            var sel = window.getSelection();
            var text = sel ? sel.toString().trim() : '';
            if (text && text.length > 1) {
              pendingSelection = text;
            }
          });
        } catch (e) {
          send({ type:'error', message: (e&&e.message)||'Reader init failed' });
        }
      }).catch(function (err) {
        send({ type:'error', message:(err&&err.message)||'book.ready failed' });
      });
    } catch (err) {
      send({ type:'error', message:(err&&err.message)||'ePub() failed' });
    }
  }

  function handleCommand(msg) {
    if (!msg || typeof msg !== 'object') return;
    var c = msg.command;
    if (c === 'next') goNext();
    else if (c === 'prev') goPrev();
    else if (c === 'goToSection' && msg.sectionIndex != null) {
      var idx = parseInt(msg.sectionIndex, 10);
      var anc = (typeof msg.anchor === 'string' && msg.anchor) ? msg.anchor : null;
      var tit = (typeof msg.title === 'string' && msg.title) ? msg.title : null;
      send({ type: 'debug', msg: 'goToSection idx=' + idx + ' anchor=' + (anc || '') + ' title=' + (tit ? tit.substring(0, 40) : '') });
      if (!isNaN(idx) && idx >= 0 && idx < spineItems.length) {
        if (typeof window.ReactNativeWebView !== 'undefined') window.__epubReflowMode = true;
        showSection(idx, false, anc, tit);
      }
    }
    else if (c === 'setFontSize' && msg.size) {
      fontSize = msg.size; applyOverrideSheet();
      if (window.__epubReflowMode) {
        /* lh changed → re-measure natural height so snap uses the new lh. */
        measurePage();
        var elFs = document.getElementById('epub-content');
        if (elFs) {
          var prevPg = currentPage;
          reflowSyncPageCount(elFs);
          currentPage = Math.min(prevPg, totalPages - 1);
          currentPage = Math.max(0, currentPage);
          reflowApplyPageTransform(elFs);
        }
        sendLocation();
        return;
      }
      paginate(function () { showPage(currentPage); });
    }
    else if (c === 'setTheme') {
      darkMode = !!msg.dark;
      applyOverrideSheet();
    }
    else if (c === 'addHighlight') {
      send({ type: 'debug', msg: 'CMD addHighlight cfi=' + msg.cfi + ' text="' + (msg.text||'').substring(0,30) + '"' });
      if (msg.cfi != null) {
        var addKey = String(msg.cfi);
        if (addKey) highlightMap[addKey] = msg;
      }
      var contentEl = document.getElementById('epub-content');
      if (contentEl) {
        applyHighlightsInContent(contentEl);
        if (window.__epubReflowMode) sendLocation();
        else paginate(function () { showPage(currentPage); });
      }
    }
    else if (c === 'removeHighlight') {
      if (msg.cfi != null) delete highlightMap[String(msg.cfi)];
      var sIdx = currentSectionIndex;
      showSection(sIdx, false);
    }
    else if (c === 'updateHighlightColor' && msg.cfi != null) {
      var updateKey = String(msg.cfi);
      if (highlightMap[updateKey]) highlightMap[updateKey].color = msg.color;
    }
    else if (c === 'clearSelection') {
      try { window.getSelection().removeAllRanges(); } catch(_){}
    }
    else if (c === 'restoreHighlights' && Array.isArray(msg.highlights)) {
      send({ type: 'debug', msg: 'CMD restoreHighlights: ' + msg.highlights.length + ' items' });
      msg.highlights.forEach(function (h) {
        if (!h || h.cfi == null) return;
        var restoreKey = String(h.cfi);
        if (restoreKey) highlightMap[restoreKey] = h;
      });
      send({ type: 'debug', msg: 'highlightMap keys: ' + Object.keys(highlightMap).join(', ') });
      var contentEl = document.getElementById('epub-content');
      if (contentEl) {
        applyHighlightsInContent(contentEl);
        if (window.__epubReflowMode) sendLocation();
        else paginate(function () { showPage(currentPage); });
      }
    }
  }

  window.startReader = startReader;
  window.handleEpubCommand = handleCommand;
  window.addEventListener('message', function (e) { try { handleCommand(JSON.parse(e.data)); } catch (_) {} });
  document.addEventListener('message', function (e) { try { handleCommand(JSON.parse(e.data)); } catch (_) {} });

  if (typeof ePub !== 'undefined') {
    setStatus('Ready…'); send({ type: 'ready' });
  } else {
    window.addEventListener('load', function () {
      if (typeof ePub !== 'undefined') { setStatus('Ready…'); send({ type: 'ready' }); }
      else send({ type: 'error', message: 'epub.js failed to load' });
    });
  }
})();
</script>
</body>
