<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EPUB Reader</title>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #000; }
    #viewer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      -webkit-user-select: text;
      user-select: text;
    }
    #status { color: #666; font-size: 13px; padding: 8px 0; }
    #epub-content { font-size: 18px; line-height: 1.7; color: #1a1a1a; }
    #epub-content img { max-width: 100%; height: auto; display: block; margin: 8px 0; vertical-align: middle; }
    #epub-content p { margin: 0 0 12px; }
    #epub-content h1,#epub-content h2,#epub-content h3 { margin: 16px 0 8px; }
  </style>
</head>
<body>
<div id="viewer">
  <div id="status">Ready – waiting for book data…</div>
  <div id="epub-content"></div>
</div>
<script>
(function() {
  var book = null;
  var currentSectionIndex = 0;
  var spineItems = [];
  var highlightMap = {};

  function send(data) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(data));
  }
  function setStatus(msg) {
    var el = document.getElementById('status');
    if (el) el.textContent = msg;
  }

  function base64ToArrayBuffer(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function startReader() {
    if (!window.epubBase64) {
      send({ type: 'error', message: 'No EPUB data provided' });
      return;
    }
    if (typeof ePub === 'undefined') {
      send({ type: 'error', message: 'epub.js not loaded' });
      return;
    }
    setStatus('Parsing EPUB…');
    var ab = base64ToArrayBuffer(window.epubBase64);
    init(ab, window.savedCfi || null);
  }

  function resolvePath(baseHref, relativeSrc) {
    if (!relativeSrc) return '';
    var baseDir = baseHref ? baseHref.replace(/[^/]+$/, '') : '';
    var path = (baseDir + relativeSrc).replace(/\\/g, '/');
    var parts = path.split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === '..') out.pop();
      else if (parts[i] !== '.' && parts[i] !== '') out.push(parts[i]);
    }
    return out.join('/');
  }

  function init(arrayBuffer, savedCfi) {
    try {
      book = ePub(arrayBuffer);

      book.ready.then(function() {
        setStatus('Building spine…');
        spineItems = [];
        book.spine.each(function(item) { spineItems.push(item); });
        if (spineItems.length === 0) {
          send({ type: 'error', message: 'Spine is empty' });
          return;
        }
        setStatus('');
        showSection(0);

        document.addEventListener('touchend', sendSelection);
        document.addEventListener('mouseup', sendSelection);
      }).catch(function(err) {
        var msg = (err && err.message) || 'book.ready failed';
        setStatus('Error: ' + msg);
        send({ type: 'error', message: msg });
      });
    } catch (err) {
      var msg = (err && err.message) || 'ePub() threw';
      setStatus('Error: ' + msg);
      send({ type: 'error', message: msg });
    }
  }

  function showSection(index) {
    if (index < 0 || index >= spineItems.length) return;
    currentSectionIndex = index;
    var section = spineItems[index];
    setStatus('Loading chapter ' + (index + 1) + '/' + spineItems.length + '…');
    section.load(book.load.bind(book)).then(function(contents) {
      var root = contents.nodeType === 1 ? contents : (contents.documentElement || contents);
      var baseHref = section.href || section.url || '';

      var html = '';
      try { html = (new XMLSerializer()).serializeToString(root); } catch(e) { html = root.outerHTML || String(root); }
      var el = document.getElementById('epub-content');
      if (el) el.innerHTML = html;
      var viewer = document.getElementById('viewer');
      if (viewer) viewer.scrollTop = 0;
      setStatus('');
      var pct = spineItems.length > 1 ? index / (spineItems.length - 1) : 1;
      var cfi = section.cfiBase || ('section-' + index);
      send({ type: 'locationChanged', cfi: cfi, percentage: pct });

      var zip = book.archive && book.archive.zip;
      var domImgs = el ? el.querySelectorAll('img') : [];
      for (var i = 0; i < domImgs.length; i++) {
        (function(img) {
          var src = img.getAttribute('src');
          if (!src || src.indexOf('data:') === 0 || src.indexOf('blob:') === 0) return;

          // Decode URL-encoded characters (e.g. %C3%A1 → á) before resolving
          var decodedSrc = src;
          try { decodedSrc = decodeURIComponent(src); } catch(e) {}
          var resolved = resolvePath(baseHref, decodedSrc);
          var ext = resolved.split('.').pop().toLowerCase().split('?')[0];
          var mimeMap = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp' };
          var mime = mimeMap[ext] || 'image/jpeg';

          function loadEntry(entry) {
            entry.async('blob').then(function(blob) {
              img.src = URL.createObjectURL(new Blob([blob], { type: mime }));
            }).catch(function() {});
          }

          if (zip) {
            // Try direct path, URL-decoded path, and filename-only fallback
            var entry = zip.file(resolved);
            if (!entry) {
              var decoded2 = resolved;
              try { decoded2 = decodeURIComponent(resolved); } catch(e) {}
              entry = zip.file(decoded2);
            }
            if (!entry) {
              // Filename-only fallback: search all entries for matching name
              var name = resolved.split('/').pop();
              zip.forEach(function(relativePath, zipEntry) {
                if (!entry && relativePath.split('/').pop() === name) entry = zipEntry;
              });
            }
            if (entry) { loadEntry(entry); return; }
          }

          // Fallback: book.load (may return string for some epub.js builds)
          book.load(resolved).then(function(data) {
            if (!data) return;
            if (data instanceof Blob) { img.src = URL.createObjectURL(data); return; }
            if (data instanceof ArrayBuffer) { img.src = URL.createObjectURL(new Blob([data], {type: mime})); return; }
            if (typeof data === 'string') {
              img.src = data.indexOf('data:') === 0 ? data : ('data:' + mime + ';base64,' + btoa(data));
            }
          }).catch(function() {});
        })(domImgs[i]);
      }
    }).catch(function(err) {
      var msg = (err && err.message) || 'section.load failed';
      setStatus('Error: ' + msg);
      send({ type: 'error', message: msg });
    });
  }

  var pendingText = null;
  function sendSelection() {
    var sel = window.getSelection();
    var text = sel ? sel.toString().trim() : '';
    if (text && text !== pendingText) {
      pendingText = text;
      send({ type: 'textSelected', text: text, cfi: '' });
      setTimeout(function() { pendingText = null; }, 500);
    }
  }

  function addHighlight(cfi, color, text, dbId) {
    highlightMap[cfi] = { text: text || '', color: color || '#ffeb3b', dbId: dbId || null };
  }
  function removeHighlight(cfi) { delete highlightMap[cfi]; }
  function updateHighlightColor(cfi, color) {
    var d = highlightMap[cfi];
    if (d) { d.color = color; }
  }

  function handleCommand(msg) {
    var c = msg.command;
    if (c === 'next') showSection(currentSectionIndex + 1);
    else if (c === 'prev') showSection(currentSectionIndex - 1);
    else if (c === 'addHighlight') addHighlight(msg.cfi, msg.color, msg.text, msg.dbId);
    else if (c === 'removeHighlight') removeHighlight(msg.cfi);
    else if (c === 'updateHighlightColor') updateHighlightColor(msg.cfi, msg.color);
    else if (c === 'restoreHighlights' && Array.isArray(msg.highlights)) {
      msg.highlights.forEach(function(h) { addHighlight(h.cfi, h.color, h.text, h.dbId); });
    }
  }

  window.startReader = startReader;
  window.handleEpubCommand = handleCommand;
  window.addEventListener('message', function(e) { try { handleCommand(JSON.parse(e.data)); } catch(_) {} });
  document.addEventListener('message', function(e) { try { handleCommand(JSON.parse(e.data)); } catch(_) {} });

  function sendReady() {
    setStatus('Ready – waiting for book data…');
    send({ type: 'ready' });
  }
  if (typeof ePub !== 'undefined') {
    sendReady();
  } else {
    window.addEventListener('load', function() {
      if (typeof ePub !== 'undefined') sendReady();
      else send({ type: 'error', message: 'epub.js failed to load' });
    });
  }
})();
</script>
</body>
</html>
